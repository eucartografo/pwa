<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#1F3864">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Família">
  <title>Orçamento Familiar</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ════════════════════════════════
     TELA DE LOGIN
════════════════════════════════ -->
<div id="screen-login" class="screen active">
  <div class="login-bg"></div>
  <div class="login-card">
    <div class="login-logo">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
        <rect width="48" height="48" rx="14" fill="#1F3864"/>
        <path d="M12 30V20l12-6 12 6v10l-12 6-12-6z" stroke="#4CAF91" stroke-width="2" fill="none"/>
        <path d="M12 20l12 6 12-6" stroke="#4CAF91" stroke-width="2"/>
        <path d="M24 26v10" stroke="#4CAF91" stroke-width="2"/>
      </svg>
    </div>
    <h1 class="login-title">Orçamento<br><span>Familiar</span></h1>
    <p class="login-sub">Joelson · Raquel · Davi · Luísa</p>
    <div id="google-btn-container"></div>
    <p class="login-hint">Acesso restrito à conta da família</p>
  </div>
</div>

<!-- ════════════════════════════════
     APP SHELL (pós-login)
════════════════════════════════ -->
<div id="screen-app" class="screen">

  <!-- SIDEBAR (desktop) -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <svg width="28" height="28" viewBox="0 0 48 48" fill="none">
        <rect width="48" height="48" rx="14" fill="#1F3864"/>
        <path d="M12 30V20l12-6 12 6v10l-12 6-12-6z" stroke="#4CAF91" stroke-width="2" fill="none"/>
        <path d="M12 20l12 6 12-6" stroke="#4CAF91" stroke-width="2"/>
        <path d="M24 26v10" stroke="#4CAF91" stroke-width="2"/>
      </svg>
      <span class="sidebar-title">Família</span>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item active" data-page="painel">
        <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
        Painel
      </button>
      <button class="nav-item" data-page="contas">
        <svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 4v10h16V8H4zm2 2h4v2H6v-2zm0 4h4v2H6v-2zm6-4h6v6h-6v-6z"/></svg>
        Contas
      </button>
      <button class="nav-item" data-page="receitas">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/><path d="M11 6h2v2h-2zM11 16h2v2h-2z"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor"/><path d="M12 8v1m0 6v1m-4-4h1m6 0h1"/></svg>
        Receitas
      </button>
      <button class="nav-item" data-page="despesas">
        <svg viewBox="0 0 24 24"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg>
        Despesas
      </button>
      <button class="nav-item" data-page="orcamento">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
        Orçamento
      </button>
      <button class="nav-item" data-page="cartao">
        <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg>
        Cartão
      </button>
      <button class="nav-item" data-page="dividas">
        <svg viewBox="0 0 24 24"><path d="M11.5 2C6.81 2 3 5.81 3 10.5S6.81 19 11.5 19h.5v3c4.86-2.34 8-7 8-11.5C20 5.81 16.19 2 11.5 2zm1 14.5h-2v-2h2v2zm0-4h-2c0-3.25 3-3 3-5 0-1.1-.9-2-2-2s-2 .9-2 2h-2c0-2.21 1.79-4 4-4s4 1.79 4 4c0 2.5-3 2.75-3 5z"/></svg>
        Dívidas
      </button>
      <button class="nav-item" data-page="metas">
        <svg viewBox="0 0 24 24"><path d="M19.07 4.93l-1.41 1.41C19.1 7.79 20 9.79 20 12c0 4.42-3.58 8-8 8s-8-3.58-8-8c0-4.07 3.03-7.44 7-7.93V6.1C7.21 6.58 5 9.07 5 12c0 3.87 3.13 7 7 7s7-3.13 7-7c0-1.93-.78-3.68-2.04-4.95zM13 1h-2v10.59l3.71 3.71 1.41-1.41L13 10.17V1z"/></svg>
        Metas
      </button>
    </nav>
    <div class="sidebar-footer">
      <div class="user-chip" id="user-chip">
        <img id="user-avatar" src="" alt="">
        <span id="user-name"></span>
      </div>
      <button class="btn-logout" id="btn-logout">Sair</button>
    </div>
  </aside>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="main-content" id="main-content">

    <!-- TOPBAR (mobile) -->
    <header class="topbar">
      <h2 class="topbar-title" id="page-title">Painel</h2>
      <div class="topbar-actions">
        <button class="btn-icon" id="btn-refresh" title="Atualizar">
          <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
        <img id="user-avatar-mobile" src="" alt="" class="avatar-sm">
      </div>
    </header>

    <!-- PÁGINAS -->
    <div class="pages">
      <div id="page-painel" class="page active"></div>
      <div id="page-contas" class="page"></div>
      <div id="page-receitas" class="page"></div>
      <div id="page-despesas" class="page"></div>
      <div id="page-orcamento" class="page"></div>
      <div id="page-cartao" class="page"></div>
      <div id="page-dividas" class="page"></div>
      <div id="page-metas" class="page"></div>
    </div>

  </main>

  <!-- BOTTOM NAV (mobile) -->
  <nav class="bottom-nav" id="bottom-nav">
    <button class="bn-item active" data-page="painel">
      <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
      <span>Painel</span>
    </button>
    <button class="bn-item" data-page="receitas">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
      <span>Receitas</span>
    </button>
    <button class="bn-item" data-page="despesas">
      <svg viewBox="0 0 24 24"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg>
      <span>Despesas</span>
    </button>
    <button class="bn-item" data-page="metas">
      <svg viewBox="0 0 24 24"><path d="M19.07 4.93l-1.41 1.41C19.1 7.79 20 9.79 20 12c0 4.42-3.58 8-8 8s-8-3.58-8-8c0-4.07 3.03-7.44 7-7.93V6.1C7.21 6.58 5 9.07 5 12c0 3.87 3.13 7 7 7s7-3.13 7-7c0-1.93-.78-3.68-2.04-4.95zM13 1h-2v10.59l3.71 3.71 1.41-1.41L13 10.17V1z"/></svg>
      <span>Metas</span>
    </button>
    <button class="bn-item" data-page="orcamento">
      <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/></svg>
      <span>Mais</span>
    </button>
  </nav>

</div>

<!-- TOAST -->
<div id="toast" class="toast"></div>

<!-- MODAL GENÉRICO -->
<div id="modal-overlay" class="modal-overlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h3 id="modal-title"></h3>
      <button class="btn-icon" id="modal-close">
        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- Google Identity -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="config.js"></script>
<script src="sheets.js"></script>
<script src="pages.js"></script>
<script src="app.js"></script>

</body>
</html>
